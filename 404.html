<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Page not found | Stackly Gov Services</title>
<meta name="description" content="The page you are looking for could not be found. Go back or return to the Stackly Gov Services home page.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="stackly-logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Stackly Gov Services — Cream / Green / Navy / Saffron theme
   ========================================================== */
:root{--cream:#FBF5E6;--cream2:#F3EAD0;--green:#0F5C4D;--navy:#14213D;--saffron:#F28C28;--ink:#2B2B2B;--r:20px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:Poppins,sans-serif;background:var(--navy);color:var(--ink);overflow-x:hidden;line-height:1.7;font-size:16px}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit}
h1{font-family:'Playfair Display',serif;line-height:1.2;color:#fff}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px;border-radius:6px}
.wrap{width:min(92%,1200px);margin-inline:auto}

/* buttons (same pill style as the site) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:14px 30px;border-radius:50px;font-weight:600;font-size:.98rem;cursor:pointer;border:2px solid transparent;transition:transform .3s,background .3s,color .3s,box-shadow .3s}
.btn svg{transition:transform .3s}
.btn-p{background:var(--saffron);color:#fff;box-shadow:0 8px 20px rgba(242,140,40,.35)}
.btn-p:hover{transform:translateY(-4px);background:#d9761a}
.btn-p:hover svg{transform:translateX(4px)}
.btn-o{background:transparent;border-color:rgba(251,245,230,.6);color:var(--cream)}
.btn-o:hover{transform:translateY(-4px);background:var(--cream);color:var(--navy);border-color:var(--cream)}
.btn-o:hover svg{transform:translateX(-4px)}

/* ---------- 404 page ---------- */
.e404{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;
  padding:clamp(2rem,6vh,4rem) 0;color:#d9d9d9;
  background:radial-gradient(60% 55% at 85% 8%,rgba(242,140,40,.34),transparent 70%),radial-gradient(55% 60% at 8% 92%,rgba(15,92,77,.65),transparent 70%),linear-gradient(160deg,var(--navy) 20%,#0d172c 100%)}
.e404::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(251,245,230,.09) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 45%,#000,transparent);pointer-events:none}
.e404 .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.tag{display:inline-block;background:rgba(251,245,230,.1);color:var(--saffron);padding:6px 18px;border-radius:50px;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:.6rem;border:1px solid rgba(242,140,40,.35)}
.e404-num{display:flex;align-items:center;justify-content:center;gap:.04em;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(5.5rem,24vw,13rem);line-height:1;color:var(--cream);letter-spacing:-.04em;margin:.1em 0 .18em;user-select:none;animation:e404-rise .9s var(--ease) both}
.e404-num span{display:block}
.e404-seal{height:.8em;width:auto;overflow:visible;flex:none}
.e404-seal .spin{transform-origin:100px 100px;animation:e404-spin 30s linear infinite}
.e404-seal .look{animation:e404-look 5s ease-in-out infinite}
.e404 h1{font-size:clamp(1.6rem,4.4vw,2.7rem);max-width:24ch;text-wrap:balance;margin-bottom:1rem;animation:e404-rise .9s .12s var(--ease) both}
.e404 p.lead{font-size:clamp(1rem,2.2vw,1.15rem);color:#e3e0d2;max-width:52ch;margin-bottom:2rem;animation:e404-rise .9s .22s var(--ease) both}
.e404 .btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;animation:e404-rise .9s .32s var(--ease) both}
@keyframes e404-rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes e404-spin{to{transform:rotate(360deg)}}
@keyframes e404-look{0%,12%{transform:translateX(0)}28%,44%{transform:translateX(-13px)}60%,76%{transform:translateX(13px)}92%,100%{transform:translateX(0)}}
@media (max-width:900px){.e404{padding-top:2rem}}
@media (max-width:600px){
  .e404 .btn-row{flex-direction:column;align-items:stretch;width:100%;max-width:340px}
  .e404 .btn{width:100%}
  .e404 p.lead{margin-bottom:1.6rem}
}
@media (max-width:380px){.e404-num{font-size:clamp(4.6rem,25vw,5.5rem)}}
@media (max-height:560px) and (orientation:landscape){
  .e404{min-height:auto;padding:1.5rem 0}
  .e404-num{font-size:clamp(4rem,16vh,6.5rem);margin:.05em 0 .1em}
  .e404 h1{font-size:1.5rem;margin-bottom:.6rem}
  .e404 p.lead{margin-bottom:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  .e404-num,.e404 h1,.e404 p.lead,.e404 .btn-row,.e404-seal .spin,.e404-seal .look{animation:none}
}

</style>
<style>
/* Stackly preloader (shared by all pages) */
#preloader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 40%,#1d2f55 0,#14213D 60%);color:#FBF5E6;font-family:Poppins,sans-serif;line-height:1.7;transition:opacity .6s ease,visibility 0s .6s}
#preloader.done{opacity:0;visibility:hidden;pointer-events:none}
html.is-loading,html.is-loading body{overflow:hidden}
#preloader *{box-sizing:border-box;margin:0;padding:0}
.pl-chakra{position:relative;width:150px;height:150px;display:grid;place-items:center}
.pl-chakra svg{position:absolute;inset:0;width:100%;height:100%}
.pl-spin{transform-origin:50% 50%;animation:plspin 6s linear infinite}
.pl-ring{fill:none;stroke:#F28C28;stroke-width:3;stroke-linecap:round;stroke-dasharray:90 190;transform-origin:50% 50%;animation:plspin 1.4s cubic-bezier(.6,.1,.4,.9) infinite}
.pl-brand{text-align:center}
.pl-brand h2{font-family:'Playfair Display',serif;font-size:clamp(20px,3.4vw,28px);color:#fff;letter-spacing:.5px;line-height:1.2}
.pl-brand p{font-size:13px;letter-spacing:2px;color:#F28C28;font-weight:600;margin-top:4px;text-transform:uppercase}
.pl-bar{width:min(260px,70vw);height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#F28C28,#ffb865);transition:width .35s ease}
.pl-pct{font-size:13px;font-weight:500;color:#cfd5e6;margin-top:-14px;font-variant-numeric:tabular-nums}
@keyframes plspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pl-spin,.pl-ring{animation:none!important}}
</style>
</head>
<body>
<script>
/* Stackly preloader (shared by all pages). Include as the first element inside <body>. */
(function () {
  "use strict";
  var html = document.documentElement;
  html.classList.add("is-loading");
  document.body.insertAdjacentHTML("afterbegin", '<div id="preloader" role="status" aria-live="polite" aria-label="Loading Stackly Gov Services"><div class="pl-chakra"><svg viewBox="0 0 150 150" aria-hidden="true"><g class="pl-spin" stroke="rgba(255,255,255,.35)" stroke-width="1.6" fill="none"><circle cx="75" cy="75" r="66" stroke-width="2"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(0 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(15 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(30 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(45 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(60 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(75 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(90 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(105 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(120 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(135 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(150 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(165 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(180 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(195 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(210 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(225 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(240 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(255 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(270 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(285 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(300 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(315 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(330 75 75)"/><line x1="75" y1="75" x2="75" y2="14" transform="rotate(345 75 75)"/></g><circle class="pl-ring" cx="75" cy="75" r="70"/></svg></div><div class="pl-brand"><h2>Stackly Gov Services</h2><p>Citizen Services Made Simple</p></div><div class="pl-bar"><i id="plBar"></i></div><div class="pl-pct" id="plPct">0%</div></div>');
  var pre = document.getElementById("preloader"),
      bar = document.getElementById("plBar"),
      pct = document.getElementById("plPct");
  var start = Date.now(), MIN = 1200, MAX = 6000, val = 0, finished = false;
  function set(v) { val = Math.max(val, Math.min(v, 100)); bar.style.width = val + "%"; pct.textContent = Math.round(val) + "%"; }
  // simulated progress that eases toward 90% until the page has really loaded
  var t = setInterval(function () { if (val < 90) set(val + (90 - val) * 0.08 + 0.4); }, 120);
  function finish() {
    if (finished) return; finished = true; clearInterval(t);
    setTimeout(function () {
      set(100);
      setTimeout(function () {
        pre.classList.add("done");
        html.classList.remove("is-loading");
        setTimeout(function () { if (pre.parentNode) pre.parentNode.removeChild(pre); }, 800);
      }, 300);
    }, Math.max(0, MIN - (Date.now() - start)));
  }
  if (document.readyState === "complete") finish(); else window.addEventListener("load", finish);
  setTimeout(finish, MAX); // safety net if an asset hangs
})();
</script>

<main id="main">
<section class="e404">
  <div class="wrap">
    <span class="tag">Error 404</span>
    <div class="e404-num" aria-hidden="true"><span>4</span><svg class="e404-seal" viewBox="0 0 200 200" role="img" aria-label="0"><defs><linearGradient id="e404g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F28C28"/><stop offset="1" stop-color="#0F5C4D"/></linearGradient></defs>
      <circle cx="100" cy="100" r="92" fill="none" stroke="#FBF5E6" stroke-width="8"/>
      <g class="spin"><circle cx="100" cy="100" r="76" fill="none" stroke="#F28C28" stroke-width="4" stroke-dasharray="3 11" stroke-linecap="round"/></g>
      <g class="look">
        <g stroke="#FBF5E6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M70 62h38l20 20v56a6 6 0 0 1-6 6H70a6 6 0 0 1-6-6V68a6 6 0 0 1 6-6Z"/>
          <path d="M108 62v20h20"/>
        </g>
        <g stroke="#F28C28" stroke-width="5" stroke-linecap="round"><path d="M76 98h34M76 112h24"/></g>
        <circle cx="112" cy="118" r="20" fill="rgba(15,92,77,.55)" stroke="url(#e404g)" stroke-width="7"/>
        <path d="M126 133l16 16" stroke="url(#e404g)" stroke-width="9" stroke-linecap="round"/>
      </g>
    </svg><span>4</span></div>
    <h1>We could not find that page</h1>
    <p class="lead">The page you are looking for may have moved, been renamed or never existed. Go back to where you were, or head to the home page to find the service you need.</p>
    <div class="btn-row">
      <button type="button" class="btn btn-o back" id="goBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Go back</span></button>
      <a class="btn btn-p" href="index.html"><span>Back to home</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
</section>
</main>

<script>
/* 404: go back to the previous page and restore its scroll position */
(function(){
  try{if('scrollRestoration' in history)history.scrollRestoration='auto'}catch(_){}
  var b=document.getElementById('goBack');
  if(!b)return;
  b.addEventListener('click',function(){
    if(window.history.length>1){
      window.history.back();
      /* if there was nowhere to go back to, fall back to the home page */
      setTimeout(function(){if(!document.hidden)window.location.href='index.html'},700);
    }else{window.location.href='index.html'}
  });
})();
</script>
</body>
</html>
